name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short

  i18n-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: i18n extract dry-run (MD)
        run: uv run python tools/i18n_extract_md.py --dry-run

      - name: i18n CLI extract (generate POT)
        run: uv run python tools/i18n_extract_cli.py

      - name: i18n CLI POT freshness check
        run: uv run python tools/i18n_extract_cli.py --check

      - name: i18n CLI unmarked print scan
        run: uv run python tools/i18n_extract_cli.py --scan

      - name: i18n unified QA (CLI domain, JSON)
        run: uv run python tools/i18n_qa.py --json --domain cli
