name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint skills structure
        run: bash scripts/lint-skills.sh

      - name: Lint skills sync (skills/ → .claude/skills/)
        run: bash scripts/lint-skills-sync.sh

      - name: Lint command sync
        run: bash scripts/lint-commands.sh

      - name: Lint openai.yaml coverage
        run: bash scripts/lint-openai-yaml.sh

      - name: Lint rules sync
        run: bash scripts/lint-rules.sh

      - name: Check lesson prerequisites consistency
        run: python tools/check_prerequisites.py

      - name: Check command script paths
        run: python tools/check_command_paths.py

      - name: Check plugin registry URLs
        run: python tools/check_command_paths.py --plugins

      - name: Check security hooks syntax
        run: |
          python -m py_compile .claude/hooks/bash_guard.py
          python -m py_compile .claude/hooks/write_guard.py
          python -m py_compile .cursor/hooks/bash_guard.py
          python -m py_compile .cursor/hooks/write_guard.py

      - name: Check import consistency
        run: python tools/check_imports.py

      - name: Check translation coverage
        run: python tools/check_translations.py --lang all --verbose

      - name: Check residual Japanese in translations
        run: python tools/check_residual_japanese.py

      - name: Run tests
        run: pytest tests/ -v --cov=tools --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
