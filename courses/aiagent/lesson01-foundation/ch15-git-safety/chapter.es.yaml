# Capítulo 15: Seguridad en Git
id: "ch15-git-safety"
order: 15
name: "Seguridad en Git"
description: "Aprende las operaciones peligrosas de Git y cómo manejarlas de forma segura. El contenido cubre operaciones que pueden perder trabajo no guardado o historial compartido si se usan incorrectamente — reset, rebase, checkout, clean y force push — junto con hábitos protectores: verificar antes de operaciones destructivas, usar ramas y revisar commits generados por IA antes de enviarlos."
type: "manual"
estimatedMinutes: 20
thumbnail: "thumbnail.png"
prerequisites:
  - "ch14-git-basics"
objectives:
  - "Comprender las operaciones peligrosas de Git (force push, reset --hard, etc.)"
  - "Adoptar prácticas seguras de Git"
  - "Entender la colaboración segura entre agentes de IA y Git"
