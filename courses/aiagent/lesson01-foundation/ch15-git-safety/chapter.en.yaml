name: "Git Safety"
description: "Learn dangerous Git operations and how to handle them safely. The course covers operations that can lose unsaved work or shared history if misused — reset, rebase, checkout, clean, and force push — along with protective habits: checking before destructive operations, using branches, reviewing AI-generated commits before pushing, and recovering from mistakes."
