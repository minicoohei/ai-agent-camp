# Chapter 3: AI Agents
id: "ch03-agents"
order: 3
name: "AI Agents"
description: "Learn how agents work and their autonomy levels. The course covers the difference between regular chat assistants and AI agents, the agent loop — receiving goals, planning, using tools, observing results, and deciding next actions — and autonomy levels from fully automatic to human-in-the-loop. Understand the benefits and risks of agent autonomy and how to design safe human checkpoints."
