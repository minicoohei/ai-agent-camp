description: "選択したツールの基本操作を学びます。教材では、Cursor、Claude Code、Codex それぞれの入口、画面構成、チャットやターミナルでの依頼方法、ファイル編集、承認、作業確認、安全設定の基本導線を扱います。どのツールでも重要なのは、AIに目的と制約を明確に伝え、差分を確認し、危険操作の前に止まり、必要に応じてレビューやテストで検証することです。ツール固有のUI差分を理解しながら、共通する安全な操作習慣を身につけます。"
