# Chapter 8: RAG
id: "ch08-rag"
order: 8
name: "RAG"
description: "Learn how Retrieval-Augmented Generation works and how to apply it. The course covers how RAG retrieves external documents, adds the results to context, and generates answers; the Ingestion, Retrieval, Augmentation, and Generation pipeline; vector search and similarity; design patterns for company data, PDFs, and Notion pages; and the boundary between what RAG solves and what it does not."
