objectives:
  - "Explain what RAG is and why it is needed"
  - "Understand the 4-step RAG process (Ingestion → Retrieval → Augmentation → Generation)"
  - "Understand the role of vector databases"
  - "Decide when to use RAG vs. fine-tuning"
