# Capítulo 10: Alucinación
id: "ch10-hallucination"
order: 10
name: "Alucinación"
description: "Aprende el fenómeno en que la IA produce información errónea pero plausible, sus causas, tipos y contramedidas. El contenido cubre cómo los LLMs generan texto de forma probabilística y pueden afirmar cosas que no saben, fabricar citas o especificaciones, o producir contenido contextualmente plausible pero factualmente incorrecto. Aprende métodos de detección y estrategias de verificación."
type: "manual"
estimatedMinutes: 25
thumbnail: "thumbnail.png"
prerequisites:
  - "ch09-fine-tuning"
objectives:
  - "Explicar qué es la alucinación y por qué ocurre"
  - "Distinguir entre tipos de alucinación"
  - "Conocer estrategias de mitigación y practicarlas"
  - "Desarrollar el hábito de verificar correctamente las respuestas de la IA"
