# Chapter 9: Skill / SubAgent / Agent Team
id: "ch09-subagent"
order: 9
name: "Skill / SubAgent"
description: "Learn skills, subagents, and agent team architectures. The course covers how Skills bundle procedures, templates, constraints, and output formats to extend AI capability; how SubAgents handle specialized tasks in parallel; and how Agent Teams coordinate multiple agents for complex workflows. Understand when to use each pattern and the safety considerations for multi-agent systems."
