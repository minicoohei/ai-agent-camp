description: "バージョン管理の基本概念を学びます。教材では、Gitをコードやファイル変更のセーブポイントとして捉え、作業ツリー、ステージング、コミット、ブランチ、履歴確認、差分確認、GitHubへの連携といった基礎を扱います。AIエージェントにファイル編集を任せる場合でも、変更を記録し、必要なら戻せる状態を作ることが重要です。Git/GitHubの基礎を理解することで、AIの作業結果をレビューし、チーム共有し、トラブル時に復旧しやすくなります。"
