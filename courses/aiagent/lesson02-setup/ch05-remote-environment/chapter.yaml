# Chapter 5: リモート環境構築
id: "ch05-remote-environment"
order: 5
name: "リモート環境構築"
description: "複数端末、Dispatch、Cursor Web Agent などを使い、ローカルPCだけに依存しない学習・作業環境を構築する発展セクションです。教材のセットアップページでは、PCスペックが不足する場合や 8GB メモリ環境で Cursor / Claude Code の動作が重くなる場合、リモート実行機能の活用も検討対象として示されています。この章では、同じ教材ワークスペースを複数端末から扱う前提、クラウドやリモートエージェントに作業を任せるときの認証・権限・秘密情報管理、ローカルとリモートで差分が出やすい環境変数や依存関係の確認観点を整理します。スクショ上では近日公開の扱いですが、実務ではチーム作業、低スペックPCの補完、外出先からの継続学習に直結する準備領域です。"
type: "manual"
status: "coming_soon"
