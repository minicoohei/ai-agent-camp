# Capítulo 6: Construcción de Base de Conocimiento
id: "ch06-knowledge-base"
order: 6
name: "Construcción de Base de Conocimiento"
description: "Sección avanzada para organizar el conocimiento específico del proyecto, reglas, información de entrenamiento y criterios de decisión en una forma que los agentes de IA puedan referenciar. Este capítulo extiende ese concepto a tus propios proyectos — organizando procedimientos de negocio frecuentes, perspectivas de revisión, convenciones de código, reglas de uso de API y guías de solución de problemas."
