objectives:
  - "Explicar el propósito de una base de conocimiento para agentes de IA"
  - "Comprender la perspectiva de organizar reglas y flujos de trabajo específicos del proyecto"
  - "Entender el concepto de tratar materiales de entrenamiento, habilidades, comandos y reglas de seguridad como base de conocimiento"
  - "Comprender el diseño de información para mejorar la calidad de respuestas y la reproducibilidad en proyectos reales"
