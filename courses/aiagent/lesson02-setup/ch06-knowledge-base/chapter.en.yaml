name: "Knowledge Base Setup"
description: "An advanced section for organizing project-specific knowledge, rules, training information, and decision criteria into a form that AI agents can reference. This chapter extends that concept to your own projects — organizing frequently used business procedures, review perspectives, coding conventions, API usage rules, troubleshooting guides, and links to training or internal documents. While marked as coming soon, this is important groundwork for improving AI response quality, reproducibility, and safety by ensuring agents can always verify the same baseline assumptions."
