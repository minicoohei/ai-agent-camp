description: "プロジェクト固有の知識、ルール、教材情報、判断基準を AI エージェントが参照できる形に整える発展セクションです。教材ページでは、このワークスペース自体が AI エージェント開発の成果物であり、専用スキル、Python ツール、レッスンコマンド、安全ルール、MCP サーバー、外部 API が組み合わさっていることが説明されています。この章では、その考え方を自分のプロジェクトへ展開し、よく使う業務手順、レビュー観点、コーディング規約、API 利用ルール、トラブル対応、教材や社内ドキュメントへの導線をナレッジベース化する目的を整理します。スクショ上では近日公開ですが、実務では AI が毎回同じ前提を確認できるようにし、回答品質、再現性、安全性を高めるための重要な準備です。"
