# Chapter 13: LP/HP制作
id: "module13-lp"
order: 13
name: "LP/HP制作"
description: "ランディングページやホームページをAIエージェントと制作する方法を学びます。教材では、訴求整理、ワイヤーフレーム作成、Pencil MCPによるデザイン、HTML / Tailwind / JavaScriptによる実装、FAQやCTA、レスポンシブ対応、Vercelデプロイまでを扱います。単なるページ生成ではなく、ターゲット、課題、価値提案、セクション構成、公開前チェックを整理し、実際に動くWebページへ落とし込む章です。"
type: "manual"
estimatedMinutes: 180
prerequisites:
  - "module17-marketing"
objectives:
  - "LP/HP の要件をヒアリングして訴求ブリーフを作成できる"
  - "ワイヤーフレームとセクション構成を設計できる"
  - "Pencil と実装を往復しながらページを形にできる"
  - "公開前の確認と Vercel デプロイの流れを理解できる"
externalContent:
