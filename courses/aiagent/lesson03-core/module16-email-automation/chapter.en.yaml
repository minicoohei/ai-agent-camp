# Chapter 16: Email Automation & Marketing
id: "module16-email-automation"
order: 16
name: "Email Automation & Marketing"
description: "Learn inbound email analysis and outbound/marketing automation. The course covers gogcli-based email receipt and analysis, check-inbox, Resend-based sending, SMTP, MX, DNS, SPF, DKIM, DMARC configuration, drip campaign design, Typefully for X automation, and GitHub Actions-based scheduling — enabling end-to-end email workflow automation from receipt to structured marketing delivery."
