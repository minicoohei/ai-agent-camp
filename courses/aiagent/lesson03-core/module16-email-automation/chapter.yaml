# Chapter 16: メール自動化 & マーケティング
id: "module16-email-automation"
order: 16
name: "メール自動化 & マーケティング"
description: "メール受信分析と送信・マーケティング自動化を学びます。教材では、gogcliによるメール受信・分析、check-inbox、Resendによるメール送信、SMTP、MX、DNS、SPF、DKIM、DMARC、到達率、シーケンス、トランザクションメールとマーケティングメールの違いを扱います。メールをただ送るだけでなく、なりすまし防止、到達率、テンプレート、配信フロー、受信箱の分析までを含む業務自動化として設計します。"
