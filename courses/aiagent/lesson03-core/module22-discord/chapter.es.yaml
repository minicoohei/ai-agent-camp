# Capítulo 22: Integración con Discord
id: "module22-discord"
order: 22
name: "Integración con Discord"
description: "Construye Bots de Discord y automatiza mensajes con el plugin oficial discord de Claude Code y Channels. Incluye creación de Bots, publicaciones y lectura de canales, notificaciones, respuestas de FAQ, moderación e integraciones externas, con énfasis en permisos, pairing, allowlists, información personal y procedimientos de detención ante respuestas erróneas en comunidades o puntos de contacto con clientes."
type: "manual"
estimatedMinutes: 60
thumbnail: "thumbnail.png"
objectives:
  - "Crear un bot en Discord Developer Portal y activar MESSAGE CONTENT INTENT"
  - "Instalar el plugin oficial discord de Claude Code e iniciarlo como Channel"
  - "Manejar el bot token de forma segura con /discord:configure o una variable de entorno local"
  - "Limitar el acceso del bot con pairing, allowlist y permisos por canal"
  - "Comprender los limites del API de Discord y elegir entre canales privados por cliente y bot como hub"
