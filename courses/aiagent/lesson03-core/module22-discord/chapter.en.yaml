objectives:
  - "Create a bot in the Discord Developer Portal and enable MESSAGE CONTENT INTENT"
  - "Install the official Claude Code discord plugin and launch it as a Channel"
  - "Handle the bot token safely through /discord:configure or a local environment variable"
  - "Limit bot access with pairing, allowlist, and channel permissions"
  - "Understand Discord API boundaries and choose between private client channels and a bot-as-hub pattern"
