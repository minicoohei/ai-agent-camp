# Chapter 22: Discord Integration
id: "module22-discord"
order: 22
name: "Discord Integration"
description: "Build Discord Bots and automate messages with the official Claude Code discord plugin and Channels. Cover bot creation, channel posting, message retrieval, event notifications, FAQ responses, moderation assistance, and external integrations while designing safe customer- and community-facing operations with permissions, pairing, allowlists, personal-data controls, and shutdown procedures for incorrect responses."
type: "manual"
