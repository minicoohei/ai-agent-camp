description: "Experimenta el ciclo completo de desarrollo de productos desde entrevistas con clientes hasta creación de PRD, definición de requisitos, diseño, prototipado, pruebas y operaciones. El contenido cubre investigación de usuarios con AskQuestion, requisitos de partes interesadas, PRD Working Backwards, descripción de casos de uso, diagramas de secuencia, diagramas de transición de pantallas, diseño de DB y pruebas con Playwright y pytest."
