# Capítulo 21: Integración con Figma
id: "module21-figma"
order: 21
name: "Integración con Figma"
description: "Combina el MCP oficial de Figma con el MCP del sistema de diseño Serendie para que la IA lea y escriba datos de Figma y produzca interfaces alineadas con el sistema de diseño. Aprende a inspeccionar archivos, frames, componentes y estilos; extraer especificaciones; convertir la intención de diseño en instrucciones de implementación; revisar diseños; y elegir entre Figma y Pencil MCP respetando permisos y alcance de uso compartido."
type: "manual"
estimatedMinutes: 60
thumbnail: "thumbnail.png"
objectives:
  - "Explicar cómo se reparten responsabilidades el MCP oficial de Figma y Serendie MCP"
  - "Instalar el plugin de Figma en Claude Code y completar la autenticación OAuth"
  - "Llevar el Serendie UI Kit a tu propio equipo de Figma y publicarlo como biblioteca"
  - "Entender el flujo de implementación desde una selección en Figma hasta Claude y las actualizaciones de código/Figma"
