objectives:
  - "記事のテーマと読者像を設計できる"
  - "アウトラインから初稿作成までを効率化できる"
  - "文体調整、校閲、ファクトチェックの役割を分けて進められる"
  - "記事制作に必要な補助素材を整理できる"
