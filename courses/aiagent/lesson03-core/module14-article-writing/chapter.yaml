# Chapter 14: 記事作成
id: "module14-article-writing"
order: 14
name: "記事作成"
description: "ブログやドキュメントの記事をAIエージェントで作成する方法を学びます。教材では、テーマ決定、ターゲット読者設定、アウトライン生成、文体学習、スタイルプロファイル、ドラフト執筆、挿絵や図表生成、校閲、ファクトチェック、出典確認を扱います。AIに文章を書かせるだけでなく、自分らしい文体、読者に合う構成、事実検証、公開品質のレビューまで含めた記事制作ワークフローを身につけます。"
type: "manual"
