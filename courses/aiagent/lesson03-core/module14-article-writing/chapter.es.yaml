thumbnail: "thumbnail.png"
prerequisites:
  - "module17-marketing"
objectives:
  - "Diseñar el tema del artículo y el lector objetivo"
  - "Acelerar el flujo desde el esquema hasta el primer borrador"
  - "Separar los roles de estilo, corrección y fact-checking"
  - "Organizar los materiales de apoyo necesarios para la producción"
