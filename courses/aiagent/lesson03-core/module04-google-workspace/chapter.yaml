description: "Google Calendar、Gmail、Drive、Sheets をAIエージェントで統合操作し、AI秘書のような業務自動化を構築する章です。教材では、Google Workspace統合スキル、gogcli、GAS管理スキルを使い、空き時間検索、メール分析、返信漏れ抽出、Driveファイル管理、Sheets連携、認証テスト、定期実行や通知パイプラインを扱います。個別アプリの操作ではなく、Google Workspace全体をAPIとCLIでつなぎ、日々の確認・整理・通知・連携を再現可能なワークフローにします。"
