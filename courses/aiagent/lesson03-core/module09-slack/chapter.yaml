# Chapter 9: Slack検索・分析
id: "module09-slack"
order: 9
name: "Slack検索・分析"
description: "Slackとの連携機能を構築し、チャンネル検索、人物・イベント検索、TODO抽出、会話履歴の分析を行う方法を学びます。教材では、Slackデータのセマンティック検索や分析、検索条件の設計、チャンネルやメッセージ取得、業務上の要約やアクション抽出を扱います。社内コミュニケーションをAIが参照する場合の権限、機密情報、検索範囲、出典確認を意識しながら、必要な情報へ素早く到達するワークフローを作ります。"
type: "manual"
