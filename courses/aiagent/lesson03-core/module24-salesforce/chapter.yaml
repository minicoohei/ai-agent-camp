description: "Salesforce APIを使ったCRMデータ操作と自動化を扱う近日公開モジュールです。想定内容は、リード、取引先、商談、活動履歴の取得・更新、営業レポート、フォローアップ提案、マーケティングやメール自動化との接続です。CRMは顧客情報と営業判断の中心になるため、AIエージェントに任せる操作範囲、更新前の承認、監査ログ、重複・誤更新の検出を重視し、安全なCRM自動化の基礎を学ぶ章です。"
