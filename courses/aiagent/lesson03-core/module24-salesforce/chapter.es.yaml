# Capítulo 24: Integración con Salesforce CLI
id: "module24-salesforce"
order: 24
name: "Integración con Salesforce CLI"
description: "Usa sf CLI y el inicio de sesión en navegador para obtener Leads, Cuentas, Oportunidades e historial de actividades con SOQL, actualizar datos masivamente por CSV y gestionar metadatos desde la terminal con un agente de IA. Como el CRM concentra datos de clientes y decisiones comerciales, también define el alcance delegado, aprobaciones previas, registros de auditoría, detección de duplicados o errores e integración con automatización de marketing y correo."
type: "manual"
estimatedMinutes: 60
thumbnail: "thumbnail.png"
objectives:
  - "Instalar sf CLI y conectarse con login por navegador"
  - "Gestionar varias orgs con aliases"
  - "Consultar Cuentas, Oportunidades y Leads con SOQL"
  - "Ejecutar operaciones masivas de insert, update y upsert con CSV"
  - "Hacer deploy y retrieve de metadatos como Apex, Flow y Layouts"
